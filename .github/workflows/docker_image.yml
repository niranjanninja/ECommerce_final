name: Docker Image

on:
  push:
    branches: [ new_branch ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ninja0821/ecommerce:latest .

      - name: Push Docker Image
        run: docker push ninja0821/ecommerce:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH }} 
          script: |
            docker stop ecommerce_app || true
            docker rm ecommerce_app || true
            docker pull ninja0821/ecommerce:latest
            docker run -d  -p 80:5000  --name ecommerce_app  ninja0821/ecommerce:latest
