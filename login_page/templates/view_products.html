<!DOCTYPE html>
<head>
        <center>
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
                <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
                <link rel="stylesheet" href="{{ url_for('static', filename='view_products.css') }}">
                <!-- <link rel="stylesheet" href="view_products.css"> -->
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                        <div class="container-fluid">
                                <div class="collapse navbar-collapse" >
                                        <div class="navbar-nav">
                                                {%if name%}
                                                <a class="nav-link fw-bold">Hello {{name}}</a>
                                                {%endif%}
						<a class="nav-link" href="{{url_for('home_page',name=name)}}">Home</a>
                                                <a class="nav-link" href="{{url_for('inventory_details')}}">Inventory</a>
						<a class="nav-link" href="{{url_for('hello_admin')}}">Customer Table</a>
                                                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                                        </div>
                                </div>
                        </div>
                </nav>
                <h1>View Item</h1>
        </center>
</head>
<body>
                <div class="wrapper">
                        <div class="mb-3 img">
                                {%if image%}
                                <img src="{{image}}" width="300px" height="500px" class="img-thumbnail image"> 
                                {%endif%}
                        </div>
                        <div class="box">
                                <div class="mb-3">
                                        <h4><label class="form-label">Product ID</label></h4>
					<p>{{product_id}}</p>
                                </div>

                                <div class="mb-3">
                                        <h4><label class="form-label">Name</label></h4>
					<p>{{product_name}}</p>
                                </div>

                                <div class="mb-3">
					<h4><label class="form-label">Product Description</label></h4>
					<p>{{description}}</p>
                                </div>

                                <div class="mb-3">
                                        <h4><label class="form-label">Quantity</label></h4>
					<p>{{quantity}}</p>
                                </div>

                                <div class="mb-3">
                                        <h4><label class="form-label">Price</label></h4>
					<p>{{price}}</p>
                                </div>

                                </div>
                        </div>
                </div>


        </form>
</body>
