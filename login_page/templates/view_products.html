<!DOCTYPE html>
<head>
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
                <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
                <link rel="stylesheet" href="{{ url_for('static', filename='view_products.css') }}">
                <!-- <link rel="stylesheet" href="view_products.css"> -->
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                        <div class="container-fluid">
                         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                        </button>
                                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                                        <div class="navbar-nav">
                                                {%if name%}
                                                <div class="nav-item dropdown">
                                                <button class="nav-link dropdown-toggle fs-5 fw-bold" data-bs-toggle="dropdown"aria-expanded="false">Hello {{ name }}</button>
                                                <ul class="dropdown-menu dropdown-menu-end">
                                                <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                                </ul>
                                                </div>
                                                {%endif%}						
						<a class="nav-link" href="{{url_for('home.home_page',name=name)}}">Home</a>
                                                <a class="nav-link" href="{{url_for('inventory.inventory_details')}}">Inventory</a>
						<a class="nav-link" href="{{url_for('admin.hello_admin')}}">Customer Table</a>
                                        </div>
                                </div>
                        </div>
                </nav>
         <center>
                <h1>View Item</h1>
        </center>
</head>
<body>
                <div class="container">
                        <div id="carousel{{product_id}}" class="carousel slide carimage">
                                <div class="carousel-inner">
                                        {%for i in url%}
                                        <div class="carousel-item {%if loop.index0==0%}active{%endif%}">
                                                <img src="{{i}}" class="d-block" width="500px" height="500px">
                                        </div>
                                        {%endfor%}
                                </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carousel{{product_id}}" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carousel{{product_id}}" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                        </button>
                        </div>                        

			<div class="box">
                                <div class="mb-3">
                                        <h4><label class="form-label">Product ID</label></h4>
					<p>{{product_id}}</p>
                                </div>

				<div class="mb-3">
				        <h4><label class="form-label">Category</label></h4>
					<p>{{category_name}}</p>
				</div>

				<div class="mb-3">
				        <h4><label class="form-label">Brand</label></h4>
					<p>{{product_brand}}</p>
				</div>

                                <div class="mb-3">
                                        <h4><label class="form-label">Name</label></h4>
					<p>{{product_name}}</p>
                                </div>

                                <div class="mb-3">
					<h4><label class="form-label">Product Description</label></h4>
					<p>{{description}}</p>
                                </div>

				<div class="mb-3">
				        <h4><label class="form-label">Features</label></h4>
                                        {%for i in features%}
					<p>{{i}}</p>
                                        {%endfor%}
				</div>

                                <div class="mb-3">
                                        <h4><label class="form-label">Quantity</label></h4>
					<p>{{quantity}}</p>
                                </div>

                                <div class="mb-3">
                                        <h4><label class="form-label">Price</label></h4>
					<p class="bi bi-currency-rupee">{{price}}</p>
                                </div>

				<div class="mb-3">
				        <h4><label class="form-label">Vendor Name</label></h4>
					<p>{{vendor}}</p>
				</div>

                        </div>
                </div>

        </form>
</body>
