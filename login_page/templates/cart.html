<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='show_product_user.css') }}">
</head>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-dark">
                <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                        </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                         <div class="navbar-nav w-100">
                                <a class="nav-link fs-5 fw-bold me-3" href="{{url_for('home.home_page',name=name)}}">Home</a>
                                <a class="nav-link fs-5 fw-bold me-3" href="#">Track Order</a>
                                <form class="d-flex flex-grow-1 me-3" role="search" method="GET">
                                        <input class="form-control search_box_form flex-grow-1 mx-2" type="search" placeholder="Search" aria-label="Search" name="search">
                                        <button class="btn btn-outline-dark ms-2 bi bi-search" type="submit"></button>
                                </form>
                                <a class="nav-link fs-5 fw-semibold me-3 bi bi-cart" href="#">Cart</a>
                                {% if name %}
                                 <div class="nav-item dropdown">
                                        <button class="nav-link dropdown-toggle fs-5 fw-semibold me-3" data-bs-toggle="dropdown" aria-expanded="false">Hello {{ name }}</button>
                                        <ul class="dropdown-menu dropdown-menu-end">
                                        <li><a class="dropdown-item" href="#">Switch User</a></li>
                                        <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                        </ul>
                                </div>
                                {% endif %}
                        </div>
                </div>
                </div>
        </nav>
	<div class="container">
                <table class="table table-borderless">
			<thead>
				<tr>
				        <th scope="col"></th>
				        <th scope="col">Name</th>
				        <th scope="col">Quantity</th>
				        <th scope="col">Price</th>
				</tr>
			</thead>

			<tbody class="table-group-divider">
				<tr>
				      <th scope="row">1</th>
				      <td>Mark</td>
				      <td>Otto</td>
				      <td>@mdo</td>
				</tr>
			</tbody>
	        </table>
		<h4>Total<h4>
	</div>
</body>
