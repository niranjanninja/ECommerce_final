<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='cart.css') }}">
</head>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-dark">
                <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                        </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                         <div class="navbar-nav w-100">
                                <a class="nav-link fs-5 fw-bold me-3" href="{{url_for('home.home_page',name=name)}}">Home</a>
                                <a class="nav-link fs-5 fw-bold me-3" href="#">Track Order</a>
                                <form class="d-flex flex-grow-1 me-3" role="search" method="GET">
                                        <input class="form-control search_box_form flex-grow-1 mx-2" type="search" placeholder="Search" aria-label="Search" name="search">
                                        <button class="btn btn-outline-dark ms-2 bi bi-search" type="submit"></button>
                                </form>
                                <a class="nav-link fs-5 fw-semibold me-3 bi bi-cart" href="{{url_for('home.cart_items')}}">Cart</a>
                                {% if name %}
                                 <div class="nav-item dropdown">
                                        <button class="nav-link dropdown-toggle fs-5 fw-semibold me-3" data-bs-toggle="dropdown" aria-expanded="false">Hello {{ name }}</button>
                                        <ul class="dropdown-menu dropdown-menu-end">
                                        <li><a class="dropdown-item" href="#">Switch User</a></li>
                                        <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                        </ul>
                                </div>
                                {% endif %}
                        </div>
                </div>
                </div>
        </nav>
	<center>
	<h1>Cart</h1>
	<div class="container">
                <table class="table">
			<thead>
				<tr>
					<th scope="col">Brand</th>
				        <th scope="col">Name</th>
				        <th scope="col">Quantity</th>
				        <th scope="col">Price</th>
				</tr>
			</thead>

			<tbody class="table-group-divider">
                        {%for i in get_cart%}
				<tr>
				      <th scope="row">{{i[5]}}</th>
				      <td>{{i[4]}}</td>
				      <td>
				      <div class="btn-group">
                                             <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">{{i[2]}}</button>
					     <ul class="dropdown-menu">
                                             {%for j in range(1,21)%}
                                             <li><a class="dropdown-item" href="{{url_for('home.update_quantity',cart_id=i[6],quantity=j)}}">{{j}}</a></li>
                                             {%endfor%}
                                             </ul>
				      </td>
				      <td>{{i[3]*i[2]}}</td>
				      <td>
				      <a href="{{url_for('home.delete_cart',cart_id=i[6])}}" class="btn btn-danger delete"><i class="bi bi-trash3"></i></a>
				      </td>
				</tr>
			{%endfor%}
			</tbody>
		<tfoot>
                        <tr>
			        <td></td>
				<td></td>
                                <td class="fw-bold">Total</td>
                                <td>{{total}}</td>
				<td></td>
                        </tr>
                </tfoot>
	        </table>
	</div>
	</center>
	{%if total>1%}
	<button type="button" class="btn btn-success" style="margin-left:67%;">Buy Items</button>
	{%endif%}
</body>
