<!DOCTYPE html>
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='admin_login.css')}}">
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<div class="collapse navbar-collapse" >
				<div class="navbar-nav">
					<a class="nav-link " href="{{url_for('index')}}">Login</a>
				</div>
			</div>
		</div>
	</nav>
			
</head>
<body>
	<center>
		<div class="container">
			<center><h1>ADMIN LOGIN</h1></center>
			<form action="{{url_for('admin_login')}}" method="POST">
				<div>
					<label class="form-label">User Name</label>
					<input type="text" class="form-control input_box" name="name">
				</div>

				<div>
					<label class="form-label">Password</label>
					<input type="password" class="form-control input_box" name="password">
				</div>

				<div>
					<input type="submit" class="btn btn-primary button" value="SUBMIT">
				</div>
				
				{%if error%}
				<div style="color:red;">{{ error }}</div>
				{% endif %}
				
				<div class="button">
					<a href=# class="forgot_button">Forgot Password</a>
				</div>
			</form>
		</div>
	</center>
</body>
