<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='homepage.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary  border-bottom border-dark">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
         </button>
        <div class="collapse navbar-collapse ms-5" id="navbarNavDropdown">
                <div class="navbar-nav">
                        <a class="nav-link fs-5 fw-bold ms-4" href="{{url_for('home.home_page',name=name)}}">Home</a>
		      <form class="d-flex" role="search">
				 <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
				<button class="btn btn-outline-dark ms-2 bi bi-search" type="submit"></button>
			</form>

                        <a class="nav-link fs-5 fw-semibold  ms-5 bi bi-cart" href="#"> Cart</a>

                        {% if name %}
                        <div class="nav-item dropdown">
                                <button class="nav-link dropdown-toggle fs-5 fw-semibold ms-5" data-bs-toggle="dropdown" aria-expanded="false">Hello {{ name }}</button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#">Switch User</a></li>
                                <li><a class="dropdown-item" href="#">Track Order</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                </ul>
                        </div>
                        {% endif %}
                </div>
        </div>
   </nav>
	<nav class="nav flex-column category">
        <p class="fs-4 fw-bold categorycategory">Category</p>
        <a class="nav-link active fs-6 categoryitem" aria-current="page" href="{{url_for('home.cpu_items')}}" style="color:black">CPU</a>
        <a class="nav-link active fs-6 categoryitem" aria-current="page" href="{{url_for('home.headphone_items')}}" style="color:black">Headphones</a>
        <a class="nav-link active fs-6 categoryitem" aria-current="page" href="{{url_for('home.keyboard_items')}}" style="color:black">Keyboards</a>
        <a class="nav-link active fs-6 categoryitem" aria-current="page" href="{{url_for('home.monitor_items')}}" style="color:black">Monitor</a>
        <a class="nav-link active fs-6 categoryitem" aria-current="page" href="{{url_for('home.mouse_items')}}" style="color:black">Mouse</a>
        <a class="nav-link active fs-6 categoryitem" aria-current="page" href="{{url_for('home.speaker_items')}}" style="color:black">Speaker</a>
        </nav>

	<div class="line"></div>
        <div class="container">
	<div class="row g-3">
	{%for i in url_list%}
	        <div class="col-md-4">
	                        <a href="{{url_for('home.show_item_user',product_id=i[4])}}">
                                <img src="{{i[0]}}" class="row g-3 figure-img img-fluid rounded" style="width:300px;height:300px;border: 1px solid black" alt="image">
                                        <figcaption class="figure-caption">
			                <p class="fs-6 fw-bold">Brand : {{i[1]}}</p>
                                        <p class="fs-6 fw-semibold">{{i[2]}}</p>
				        <p class="fs-6 fw-semibold bi bi-currency-rupee">{{i[3]}}</p>
			        </figcaption></a>
                </div>
	{%endfor%}
	</div>

	<div class="page">
        {% if page > 1 %}
        <a href="{{url_for('home.home_page',page=page-1,sort=request.args.get('sort'))}}">Previous</a>
        {% endif %}
        <span>Page {{page}} of {{total_page}}</span>
        {% if page < total_page %}
        <a href="{{url_for('home.home_page',page=page+1,sort=request.args.get('sort'))}}">Next</a>
        {% endif %}
        </div>
	</div>
</body>
