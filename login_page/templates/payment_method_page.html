<!DOCTYPE html>
<head>
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
                <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-dark">
                <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                        </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                         <div class="navbar-nav w-100">
                                <a class="nav-link fs-5 fw-bold me-3" href="{{url_for('home.home_page',name=name)}}">Home</a>
                                <a class="nav-link fs-5 fw-bold me-3" href="{{url_for('home.order_tracking')}}">Track Order</a>
                                <form class="d-flex flex-grow-1 me-3" role="search" method="GET">
                                        <input class="form-control search_box_form flex-grow-1 mx-2" type="search" placeholder="Search" aria-label="Search" name="search">
                                        <button class="btn btn-outline-dark ms-2 bi bi-search" type="submit"></button>
                                </form>
                                {%if cart_items == 0 %}
                                <a class="nav-link fs-5 fw-semibold me-3 bi bi-cart" href="{{url_for('home.cart_items')}}">Cart</a>
                                {%else%}
                                <a class="nav-link fs-5 fw-semibold me-3 bi bi-cart" href="{{url_for('home.cart_items')}}">Cart({{cart_items}})</a>
                                {%endif%}  
                                {% if name %}
                                 <div class="nav-item dropdown">
                                        <button class="nav-link dropdown-toggle fs-5 fw-semibold me-3" data-bs-toggle="dropdown" aria-expanded="false">Hello {{ name }}</button>
                                        <ul class="dropdown-menu dropdown-menu-end">
                                        <li><a class="dropdown-item" href="#">Switch User</a></li>
                                        <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                        </ul>
                                </div>
                                {% endif %}
                        </div>
                </div>
                </div>
        </nav>
	<center>
	<h3>CHECK OUT</h3>
	</center>
	<form action="{{ url_for('home.payment_confirm') }}" method="POST">
	<div class="mt-5" style="width:500px;margin-left:35%;">
	<div class="mb-3">
	        <h5>Items On Cart : {{count}}</h5>
	        <h5>Order Total : {{total}}</h5>
	</div>
	<div class="mb-3">
		<label class="form-label">Name</label>
		<input type="text" class="form-control" name="customer_name" style="width:500px;">
        </div>
        
	<div class="mb-3">
		<label class="form-label">Address</label>
		<textarea class="form-control description" name="address" style="width:500px;"></textarea>
        </div>
        
	<div class="mb-3">
		<label class="form-label">Phone Number</label>
		<input type="text" class="form-control" name="customer_number" style="width:500px;">
        </div>
	
	<div class="mb-3">
	        <label class="form-label">Payment Method</label>
                <select class="form-select" aria-label="Default select example" name="payment_method" style="width:500px;">
                        <option selected hidden>Select Payment Method</option>
			        <option value="card">Card</option>
				<option value="cod">Cash On Delivery</option>
                </select>
        </div>
		<details>
		    <summary>Enter Card Details</summary>
		    <div class="mb-3">
			<label class="form-label">Name</label>
			<input type="text" class="form-control" name="card_name" style="width:500px;">
		    </div>
		    <div class="mb-3">
			<label class="form-label">Card Number</label>
			<input type="text" class="form-control" name="card_number" style="width:500px;">
		    </div>
		</details>
	</div>
	<center>
	<div class="mb-3">
	        <input type="submit" class="btn btn-primary" value="Submit">
	</center>
	</div>
        </form>
</body>
