<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='show_product_user.css') }}">

    <nav class="navbar navbar-expand-lg bg-body-tertiary  border-bottom border-dark">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
         </button>
        <div class="collapse navbar-collapse ms-5" id="navbarNavDropdown">
                <div class="navbar-nav">
                        <a class="nav-link fs-5 fw-bold ms-4" href="{{url_for('home.home_page',name=name)}}">Home</a>
                        <div class="search_form ">
                        <form class="d-flex  ms-5" action="#" role="search" method="GET" style="width:1000px">
                        <input class="form-control ms-5 search_box_form mx-auto" type="search"  placeholder = "Search" aria-label="Search"/ name="search">
                        <button class="btn btn-outline-dark ms-2 bi bi-search" type="submit"></button>
                        </form>
                        </div>

                        <a class="nav-link fs-5 fw-semibold  ms-5 bi bi-cart" href="#"> Cart</a>

                        {% if name %}
                        <div class="nav-item dropdown">
                                <button class="nav-link dropdown-toggle fs-5 fw-semibold ms-5" data-bs-toggle="dropdown" aria-expanded="false">Hello {{ name }}</button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#">Switch User</a></li>
                                <li><a class="dropdown-item" href="#">Track Order</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                </ul>
                        </div>
                        {% else %}
                        <div class="nav-item dropdown">
                                <button class="nav-link dropdown-toggle fs-5 fw-semibold ms-5" data-bs-toggle="dropdown" aria-expanded="false">Hello {{name}}</button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="{{ url_for('login.logout') }}">Logout</a></li>
                                </ul>
                        </div>
                        {% endif %}
                </div>
        </div>
   </nav>
</head>
<body>
	<div class="container">
		<div id="carousel{{product_id}}" class="carousel slide">
			<div class="carousel-inner">
				{%for i in url%}
				<div class="carousel-item {%if loop.index0==0%}active{%endif%}">
					<img src="{{i}}" class="d-block" width="500px" height="500px">
				</div>
				{%endfor%}
			</div>
		<button class="carousel-control-prev" type="button" data-bs-target="#carousel{{product_id}}" data-bs-slide="prev">
			<span class="carousel-control-prev-icon" aria-hidden="true"></span>
			<span class="visually-hidden">Previous</span>
		</button>
		<button class="carousel-control-next" type="button" data-bs-target="#carousel{{product_id}}" data-bs-slide="next">
			<span class="carousel-control-next-icon" aria-hidden="true"></span>
			<span class="visually-hidden">Next</span>
		</button>
		</div>

		<div class="box">
			<div class="mb-3">
				<h4><label class="fw-bold">Product Brand</label></h4>
				<p class="fs-5 fw-normal">{{product_brand}}</p>
			</div>
			<div class="mb-3">
				<h4><label class="fw-bold">Product Name</label></h4>
				<p class="fs-5 fw-normal">{{product_name}}</p>
			</div>

			<div class="mb-3">
				<h4><label class="fw-bold">Description</label></h4>
				<p class="fs-5 fw-normal">{{description}}</p>
			</div>

			<div class="mb-3">
				<h4><label class="fw-bold">Features</label></h4>
				{%for i in features%}
				<p class="fs-5 fw-normal">{{i}}</p>
				{%endfor%}
			</div>

			<div class="mb-3">
				<h4><label class="fw-bold">Price</label></h4>
				<p class="bi bi-currency-rupee fs-5 fw-normal">{{price}}</p>
			</div>

		</div>
	</div>
</body>
